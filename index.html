<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Dice Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .app-container {
            width: 90%;
            max-width: 400px;
            background: #151515;
            padding: 30px;
            border-radius: 30px;
            border: 2px solid #8e44ad;
            box-shadow: 0 0 25px rgba(142, 68, 173, 0.4);
        }
        .balance-box { margin-bottom: 20px; }
        .balance-label { font-size: 12px; color: #888; letter-spacing: 1px; }
        .balance-amount { font-size: 40px; font-weight: bold; color: #00ff88; margin: 5px 0; }
        .dice-display { font-size: 100px; margin: 25px 0; transition: 0.3s; }
        .play-button {
            background: linear-gradient(45deg, #8e44ad, #bc13fe);
            color: white;
            border: none;
            padding: 20px;
            width: 100%;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.5);
        }
        .play-button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="balance-box">
            <div class="balance-label">YOUR BALANCE</div>
            <div class="balance-amount" id="bal">0.0000</div>
            <div style="color: #8e44ad; font-size: 14px; font-weight: bold;">TON</div>
        </div>

        <div id="dice-visual" class="dice-display">🎲</div>

        <button class="play-button" onclick="rollDice()">ROLL & EARN</button>
        
        <p style="font-size: 10px; color: #444; margin-top: 20px;">Powered by TON Blockchain Technology</p>
    </div>

    <script>
        // تكوين Firebase الخاص بك
        const firebaseConfig = {
            databaseURL: "https://telegram-bot-7bc5f-default-rtdb.firebaseio.com"
        };

        // وظيفة التشغيل
        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            const tg = window.Telegram.WebApp;
            tg.expand();

            // الحصول على الـ ID
            let userId = "test_user"; 
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = tg.initDataUnsafe.user.id;
            }
            
            const userRef = db.ref('users/' + userId);

            // تحديث الرصيد من القاعدة
            userRef.on('value', (snap) => {
                const val = snap.val();
                if (val) {
                    document.getElementById('bal').innerText = parseFloat(val.balance).toFixed(4);
                } else {
                    userRef.set({ balance: 0, name: "User" });
                }
            });

            // دالة اللعب
            window.rollDice = function() {
                const dice = document.getElementById('dice-visual');
                const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
                
                // حركة بسيطة
                dice.style.transform = "rotate(360deg) scale(1.2)";
                
                setTimeout(() => {
                    dice.innerHTML = faces[Math.floor(Math.random() * 6)];
                    dice.style.transform = "rotate(0deg) scale(1)";
                    
                    // إضافة رصيد
                    userRef.child('balance').transaction((current) => {
                        return (current || 0) + 0.0001;
                    });

                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }, 300);
            };

        } catch (error) {
            console.error(error);
            alert("خطأ في الاتصال بقاعدة البيانات");
        }
    </script>
</body>
</html>
