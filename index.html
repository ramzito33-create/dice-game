<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Dice Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --ton-blue: #0088cc; --bg: #f0f2f5; }
        body { background: var(--bg); font-family: 'Arial', sans-serif; margin: 0; padding-bottom: 80px; direction: ltr; overflow-x: hidden; }
        
        /* الهيدر العلوي المحترف */
        .top-nav { background: linear-gradient(135deg, #004e92, #000428); color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 35px 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .balance-label { font-size: 0.8rem; opacity: 0.8; letter-spacing: 1px; }
        .balance-value { font-size: 2.8rem; font-weight: bold; margin: 5px 0; }
        
        /* بطاقة اللعب */
        .card { background: white; border-radius: 25px; padding: 25px; margin: -30px 20px 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; }
        .dice-area { font-size: 100px; margin: 20px 0; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-main { background: var(--ton-blue); color: white; border: none; padding: 18px; width: 100%; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,136,204,0.3); }
        .btn-main:active { transform: scale(0.98); }

        /* شريط التنقل السفلي */
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-btn { color: #888; text-decoration: none; font-size: 10px; text-align: center; border: none; background: none; flex: 1; cursor: pointer; }
        .nav-btn.active { color: var(--ton-blue); font-weight: bold; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="balance-label">AVAILABLE BALANCE</div>
        <div class="balance-value" id="user-balance">0.00000</div>
        <div style="font-size: 12px; opacity: 0.8;">TON</div>
    </div>

    <div class="card">
        <div id="dice" class="dice-area">🎲</div>
        <button class="btn-main" id="roll-button" onclick="rollDice()">🎲 PLAY & EARN</button>
        <p style="font-size: 11px; color: #888; margin-top: 15px;">Each roll earns you 0.00010 TON</p>
    </div>

    <div class="footer-nav">
        <button class="nav-btn active"><span class="nav-icon">🎲</span>DICE</button>
        <button class="nav-btn" onclick="alert('Referral system coming soon! Earn 0.02 TON per friend.')"><span class="nav-icon">👥</span>REFERRALS</button>
        <button class="nav-btn" onclick="alert('Withdrawal requires 0.05 TON minimum.')"><span class="nav-icon">💸</span>SEND</button>
    </div>

    <script>
        // --- إعدادات Firebase الخاصة بك ---
        const firebaseConfig = {
            databaseURL: "https://telegram-bot-7bc5f-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ربط تلغرام
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // الحصول على معرف المستخدم (إذا فتحته من المتصفح سيستخدم test_user)
        let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "test_user_1";
        let userRef = db.ref('users/' + userId);

        // قراءة الرصيد لحظياً من Firebase
        userRef.on('value', (snapshot) => {
            let data = snapshot.val();
            if (data) {
                document.getElementById('user-balance').innerText = parseFloat(data.balance).toFixed(5);
            } else {
                // مستخدم جديد
                userRef.set({
                    balance: 0.00000,
                    username: tg.initDataUnsafe.user?.username || "Anonymous",
                    last_play: Date.now()
                });
            }
        });

        function rollDice() {
            const dice = document.getElementById('dice');
            const btn = document.getElementById('roll-button');
            
            // حماية من الضغط المتكرر السريع
            btn.disabled = true;
            dice.style.transform = "rotate(360deg) scale(1.2)";
            
            setTimeout(() => {
                const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
                const result = Math.floor(Math.random() * 6);
                dice.innerHTML = faces[result];
                dice.style.transform = "rotate(0deg) scale(1)";
                
                // تحديث الرصيد في قاعدة البيانات
                userRef.child('balance').transaction((current) => {
                    return (current || 0) + 0.00010;
                });

                // اهتزاز الهاتف (Haptic Feedback)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
                
                btn.disabled = false;
            }, 600);
        }
    </script>
</body>
</html>
