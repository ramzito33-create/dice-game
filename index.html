<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Party Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #1a2634; /* نفس لون الخلفية في الصورة */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            margin: 0; padding: 15px;
            direction: ltr;
        }

        /* الهيدر العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 40px; border-radius: 50%; }

        .stats-top { display: flex; gap: 10px; }
        .stat-badge {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex; align-items: center; gap: 5px;
        }

        /* الكرت الاحترافي */
        .card {
            background: #253341; /* لون الكرت في الصورة */
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card-image {
            width: 80px;
            height: 80px;
            background: #d0e4f2;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
        }

        .card-title h3 { margin: 0; font-size: 18px; }
        .status-locked { color: #5a87ff; font-size: 12px; font-weight: bold; }

        /* شبكة المعلومات (Cost, 1H, 24H) */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-item {
            background: #1e2a37;
            padding: 10px;
            border-radius: 15px;
            text-align: center;
        }

        .info-label { font-size: 10px; color: #8899a6; margin-bottom: 5px; }
        .info-value { font-size: 14px; font-weight: bold; }

        /* الأزرار السفلية في الكرت */
        .card-footer {
            display: flex;
            gap: 10px;
        }

        .produced-box {
            flex: 1;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .buy-btn {
            flex: 1.5;
            background: #3d2a2f; /* لون الزر الأحمر الغامق */
            color: #ff4d4d;
            border: 1px solid #5a2a2a;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            display: flex; flex-direction: column; justify-content: center;
        }

        /* شريط التنقل السفلي */
        .navbar {
            position: fixed;
            bottom: 20px;
            left: 20px; right: 20px;
            background: rgba(37, 51, 65, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            display: flex;
            padding: 10px;
            justify-content: space-around;
        }
        .nav-item { color: #8899a6; font-size: 10px; text-align: center; }
        .nav-item.active { color: white; background: #344759; padding: 10px 20px; border-radius: 20px; margin-top: -5px; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="user-info">
            <div id="user-photo" style="width:35px; height:35px; background:#444; border-radius:50%"></div>
            <div style="font-size: 14px; font-weight: bold;">LIGHT👑 <br><span style="color:#5a87ff; font-size: 11px;">@y888el</span></div>
        </div>
        <div class="stats-top">
            <div class="stat-badge">💎 0</div>
            <div class="stat-badge">❄ 2</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-image">🐧</div>
            <div class="card-title">
                <h3>BABY PENGUIN LV.1</h3>
                <span class="status-locked">● LOCKED</span>
            </div>
            <div style="margin-left: auto; text-align: right; font-size: 12px; color: #8899a6;">LIMIT<br><b style="color:white">0</b>/10</div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">COST</div>
                <div class="info-value" style="color:#ffcc00">0.1 💎</div>
            </div>
            <div class="info-item">
                <div class="info-label">SNOW /1H</div>
                <div class="info-value" style="color:#00ccff">+3 ❄</div>
            </div>
            <div class="info-item">
                <div class="info-label">SNOW /24H</div>
                <div class="info-value" style="color:#00ffcc">+72 ❄</div>
            </div>
        </div>

        <div class="card-footer">
            <div class="produced-box">
                <div class="info-label">PRODUCED</div>
                <div class="info-value">0.0000 ❄</div>
            </div>
            <div class="buy-btn">
                <div style="font-size: 13px;">NEED 0.1000 💎</div>
                <div style="font-size: 9px; opacity: 0.7;">INSUFFICIENT BALANCE</div>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item">👛<br>WALLET</div>
        <div class="nav-item">👥<br>FRIENDS</div>
        <div class="nav-item active">🏠<br>HOME</div>
        <div class="nav-item">🔄<br>TRADE</div>
        <div class="nav-item">...<br>MORE</div>
    </div>

</body>
</html>
