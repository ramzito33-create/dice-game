<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Dice Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0088cc; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .card { background: white; color: #333; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 80%; max-width: 300px; }
        .dice { font-size: 100px; margin: 20px 0; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .balance { font-size: 18px; color: #0088cc; font-weight: bold; margin-bottom: 10px; }
        .btn { background: #0088cc; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(0,136,204,0.3); }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        <div class="balance">رصيدك: <span id="pts">0</span> نقطة</div>
        <div id="dice" class="dice">🎲</div>
        <button class="btn" onclick="roll()">ارمي النرد!</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let points = 0;

        function roll() {
            const dice = document.getElementById('dice');
            const ptsDisplay = document.getElementById('pts');
            const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            
            dice.style.transform = "rotate(360deg) scale(1.2)";
            
            setTimeout(() => {
                const result = Math.floor(Math.random() * 6);
                dice.innerHTML = faces[result];
                dice.style.transform = "rotate(0deg) scale(1)";
                points += (result + 1) * 10;
                ptsDisplay.innerHTML = points;
                
                // تنبيه خفيف في تلغرام
                tg.HapticFeedback.notificationOccurred('success');
            }, 600);
        }
    </script>
</body>
</html>
